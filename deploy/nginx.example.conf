# Contoh Nginx di host (SSL dan domain diurus tim internal Skolla). GPS dan kamera hanya jalan lewat HTTPS.
server {
  listen 443 ssl;
  server_name visit-tracker.contoh.skolla.id;
  # ssl_certificate ...; ssl_certificate_key ...;

  client_max_body_size 10m;          # foto kunjungan maks 8 MB + form; impor CSV 6 MB

  location /api/ {
    proxy_pass http://127.0.0.1:3011;
    proxy_set_header Host $host;
    # Tepat SATU proxy di depan backend (Express memakai trust proxy = 1 untuk IP asli)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host $host;
  }
}
